# Admin: a fourth repo, a fourth compose file, a fourth project. Like the
# Storefront it stays off `shopnet` — its fetches run in your browser.

name: shop-admin

services:
  admin-web:
    build:
      context: ..
      dockerfile: docker/admin-web.dev.Dockerfile
    image: shop-admin-web:dev
    ports:
      - "5174:5174"
    environment:
      # Host addresses, because the browser resolves these, not Docker.
      VITE_CATALOG_URL: "http://localhost:5101"
      VITE_ORDERS_URL: "http://localhost:5102"
    volumes:
      # Only the code you edit. node_modules and the config stay in the image.
      - ../src/src:/app/src
