name: shop-admin

services:
  admin-web:
    build:
      context: ${ADMIN_DIR:-.}
      dockerfile: admin-web.dev.Dockerfile
    environment:
      VITE_CATALOG_URL: "https://catalog.localhost"
      VITE_ORDERS_URL: "https://orders.localhost"
    volumes:
      - ${ADMIN_DIR:-.}/src/src:/app/src
    networks:
      default:
      shopnet:
        aliases:
          - admin-web

# Caddy's network; it reaches this app by its alias.
networks:
  shopnet:
    external: true
