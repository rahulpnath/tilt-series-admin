name: shop-admin

services:
  admin-web:
    build:
      context: .
      dockerfile: admin-web.dev.Dockerfile
    environment:
      VITE_CATALOG_URL: "https://catalog-${FOLDER:-main}.localhost"
      VITE_ORDERS_URL: "https://orders-${FOLDER:-main}.localhost"
    volumes:
      - ./src/src:/app/src
    networks:
      default:
      shopnet:
        aliases:
          - admin-web-${FOLDER:-main}

# Caddy's network; it reaches this app by its alias.
networks:
  shopnet:
    external: true
